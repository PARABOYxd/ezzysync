<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0F172A"/>
  
  <!-- Subtle grid pattern overlay -->
  <g opacity="0.05">
    <path d="M0 50H1200M0 100H1200M0 150H1200M0 200H1200M0 250H1200M0 300H1200M0 350H1200M0 400H1200M0 450H1200M0 500H1200M0 550H1200M0 600H1200" stroke="#94A3B8" stroke-width="1"/>
    <path d="M100 0V630M200 0V630M300 0V630M400 0V630M500 0V630M600 0V630M700 0V630M800 0V630M900 0V630M1000 0V630M1100 0V630" stroke="#94A3B8" stroke-width="1"/>
  </g>

  <!-- Glowing background accents -->
  <circle cx="1000" cy="300" r="300" fill="#F97316" fill-opacity="0.1" filter="blur(100px)"/>
  
  <!-- EzzySync Brand Header (Top-Left) -->
  <g transform="translate(60, 60)">
    <!-- Orange Icon Box -->
    <rect width="48" height="48" rx="12" fill="#F97316"/>
    <!-- Compass Vector Path -->
    <path d="M24 14C18.48 14 14 18.48 14 24C14 29.52 18.48 34 24 34C29.52 34 34 29.52 34 24C34 18.48 29.52 14 24 14ZM26.4 26.4L18 30L21.6 21.6L30 18L26.4 26.4Z" fill="white"/>
    <!-- Logo Text -->
    <text x="68" y="32" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.03em">EzzySync</text>
  </g>

  <!-- Big Headline (Center-Left) -->
  <g transform="translate(60, 220)">
    <!-- Subtitle Category Tag -->
    <rect width="180" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="90" y="18" fill="#F97316" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.05em" text-transform="uppercase">2026 Operations Playbook</text>
    
    <!-- Title -->
    <text x="0" y="90" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.03em" line-height="1.1">
      Instagram Leads
    </text>
    
    <!-- Connective arrow -->
    <g transform="translate(470, 48)">
      <rect width="90" height="42" rx="21" fill="#F97316"/>
      <path d="M40 21H50M50 21L45 16M50 21L45 26" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="590" y="90" fill="#F97316" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.03em">
      Bookings
    </text>

    <!-- Subheadline -->
    <text x="0" y="160" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" letter-spacing="-0.01em">
      Stop losing traveler inquiries. Automate responses, itineraries, and follow-ups.
    </text>
  </g>

  <!-- Interactive Device Mockups Layout (Right Side) -->
  <g transform="translate(720, 100)">
    <!-- Shadow backdrop -->
    <rect x="0" y="0" width="420" height="430" rx="24" fill="#020617" opacity="0.4"/>
    
    <!-- Instagram Chat Bubble Left -->
    <g transform="translate(30, 40)">
      <rect width="250" height="80" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="30" cy="40" r="16" fill="#E11D48"/>
      <text x="30" y="44" fill="white" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">IG</text>
      <text x="60" y="32" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Client DM</text>
      <text x="60" y="52" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500">"Share Bali package price!"</text>
    </g>

    <!-- Transition arrow down -->
    <path d="M150 140V180" stroke="#F97316" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>

    <!-- EzzySync Lead Card Right -->
    <g transform="translate(60, 200)">
      <!-- Card frame -->
      <rect width="320" height="180" rx="16" fill="#0F172A" stroke="#F97316" stroke-width="2"/>
      
      <!-- Card header -->
      <rect x="16" y="16" width="40" height="18" rx="9" fill="#FFF7ED"/>
      <text x="36" y="28" fill="#F97316" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">NEW</text>
      
      <text x="70" y="28" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Auto Captured</text>
      
      <!-- Lead Details -->
      <text x="16" y="65" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Rahul Sharma</text>
      <text x="16" y="90" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500">Bali 5 Nights Package</text>
      
      <!-- Bottom pipeline badge -->
      <line x1="16" y1="115" x2="304" y2="115" stroke="#334155"/>
      <circle cx="26" cy="142" r="10" fill="#F97316"/>
      <text x="26" y="146" fill="white" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">✓</text>
      <text x="46" y="146" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Enquiry logged in CRM</text>
    </g>
  </g>
</svg>
