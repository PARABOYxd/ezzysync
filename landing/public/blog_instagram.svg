<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Bright Background -->
  <rect width="1200" height="630" fill="#F8FAFC"/>
  
  <!-- Subtle light grid pattern overlay -->
  <g opacity="0.4">
    <path d="M0 50H1200M0 100H1200M0 150H1200M0 200H1200M0 250H1200M0 300H1200M0 350H1200M0 400H1200M0 450H1200M0 500H1200M0 550H1200M0 600H1200" stroke="#E2E8F0" stroke-width="1"/>
    <path d="M100 0V630M200 0V630M300 0V630M400 0V630M500 0V630M600 0V630M700 0V630M800 0V630M900 0V630M1000 0V630M1100 0V630" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <!-- Glowing background accents -->
  <circle cx="1000" cy="300" r="300" fill="#F97316" fill-opacity="0.05" filter="blur(80px)"/>
  
  <!-- Actual Brand Logo Embedding (Top-Left) -->
  <g transform="translate(60, 50)">
    <image href="/logo.png" x="0" y="0" width="48" height="48" />
    <text x="60" y="32" fill="#0F172A" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.03em">EzzySync</text>
  </g>

  <!-- Big Headline (Center-Left) -->
  <g transform="translate(60, 200)">
    <!-- Subtitle Category Tag -->
    <rect width="180" height="28" rx="14" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1"/>
    <text x="90" y="18" fill="#2563EB" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.05em" text-transform="uppercase">2026 Operations Playbook</text>
    
    <!-- Title -->
    <text x="0" y="90" fill="#0F172A" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.03em">
      Instagram Leads
    </text>
    
    <!-- Connective arrow -->
    <g transform="translate(470, 48)">
      <rect width="90" height="42" rx="21" fill="#F97316"/>
      <!-- SVG arrow path -->
      <path d="M40 21H50M50 21L45 16M50 21L45 26" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="590" y="90" fill="#F97316" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.03em">
      Bookings
    </text>

    <!-- Subheadline -->
    <text x="0" y="160" fill="#475569" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" letter-spacing="-0.01em">
      Stop losing traveler inquiries. Automate responses, itineraries, and follow-ups.
    </text>
  </g>

  <!-- Device Mockups Layout (Right Side) -->
  <g transform="translate(730, 90)">
    <!-- Main outer container shadow card -->
    <rect x="-10" y="-10" width="420" height="440" rx="24" fill="#000000" fill-opacity="0.03" filter="blur(4px)"/>
    <rect x="0" y="0" width="400" height="420" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Instagram Chat Bubble (Left) -->
    <g transform="translate(24, 30)">
      <rect width="260" height="84" rx="16" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="34" cy="42" r="18" fill="#E11D48"/>
      <text x="34" y="46" fill="white" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">IG</text>
      <text x="64" y="34" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">Instagram DM Inbound</text>
      <text x="64" y="56" fill="#0F172A" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">"Share Bali package price!"</text>
    </g>

    <!-- Transition arrow down -->
    <path d="M150 145V185" stroke="#F97316" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round"/>

    <!-- EzzySync Lead Card (Right) -->
    <g transform="translate(48, 200)">
      <!-- Card frame -->
      <rect width="320" height="180" rx="16" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
      
      <!-- Card header status badge -->
      <rect x="16" y="16" width="44" height="20" rx="6" fill="#FFF7ED"/>
      <text x="38" y="29" fill="#F97316" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">NEW</text>
      
      <text x="72" y="30" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">Auto Captured</text>
      
      <!-- Lead Details -->
      <text x="16" y="70" fill="#0F172A" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800">Rahul Sharma</text>
      <text x="16" y="94" fill="#475569" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Bali 5 Nights Package</text>
      
      <!-- Bottom pipeline badge -->
      <line x1="16" y1="120" x2="304" y2="120" stroke="#E2E8F0"/>
      <circle cx="28" cy="148" r="10" fill="#F97316"/>
      <text x="28" y="152" fill="white" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">✓</text>
      <text x="48" y="152" fill="#0F172A" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">Enquiry logged in CRM</text>
    </g>
  </g>
</svg>
