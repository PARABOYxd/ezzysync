name: Deploy Development (Render + Vercel Dev)

on:
  push:
    branches:
      - dev
      - develop

jobs:
  ci-validate:
    name: Build & Sanity Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Validate & Build Frontend
        working-directory: ./frontend
        env:
          VITE_RAZORPAY_KEY_ID: ${{ secrets.DEV_VITE_RAZORPAY_KEY_ID || 'rzp_test_TVVGy1XT8uURcp' }}
        run: |
          npm ci
          npm run build


      - name: Validate Backend
        working-directory: ./backend
        run: |
          npm ci
          node --check server.js

  db-health-check:
    # Diagnostic only: runs alongside the deploy and never blocks it.
    # Open this job's log (or the run's Summary tab) to see which layer fails:
    # DNS -> TCP -> login -> queries.
    name: Database Health Check (Dev)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci --omit=dev

      - name: Runner public IP (allowlist this in Render Access Control if login is reset)
        run: echo "Runner IP: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"

      - name: Run DB diagnostics
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          PGSSL: ${{ vars.DEV_PGSSL }}
          DB_REGION: ${{ vars.DEV_DB_REGION || 'oregon' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DEV_DATABASE_URL secret is not set. Skipping DB health check."
            exit 0
          fi
          node scripts/db-check.js

  deploy-backend-render:
    name: Deploy Backend to Render (Dev)
    needs: ci-validate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEV_DEPLOY_HOOK }}" ]; then
            echo "::warning::RENDER_DEV_DEPLOY_HOOK secret is not set. Skipping Render deployment trigger."
          else
            echo "Triggering Render Dev deploy hook..."
            curl -f -X POST "${{ secrets.RENDER_DEV_DEPLOY_HOOK }}"
            echo "Render deploy hook triggered successfully!"
          fi

  deploy-frontend-vercel:
    name: Deploy Frontend to Vercel (Dev Preview)
    needs: ci-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel (Preview)
        uses: amondnet/vercel-action@v25
        if: ${{ env.VERCEL_TOKEN != '' }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--preview'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
