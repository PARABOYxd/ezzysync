name: Deploy Development

on:
  push:
    branches: [dev, develop]
  workflow_dispatch:

concurrency:
  # A newer push supersedes one already deploying, rather than the two racing.
  group: deploy-dev
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  backend:
    name: Backend → Render
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        # secrets is available to `if`; a step's own `env` block is not, which
        # is why the previous `if: env.X != ''` was always false and this step
        # silently never ran while the workflow still reported success.
        if: ${{ secrets.RENDER_DEV_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_DEV_DEPLOY_HOOK }}"

      - name: Report missing secret
        if: ${{ secrets.RENDER_DEV_DEPLOY_HOOK == '' }}
        run: echo "::warning::RENDER_DEV_DEPLOY_HOOK is not set — backend was not deployed."

  frontend:
    name: Frontend → Vercel (preview)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy preview
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend

      - name: Report missing secret
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        run: echo "::warning::VERCEL_TOKEN is not set — frontend was not deployed."
