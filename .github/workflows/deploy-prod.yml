name: Deploy Production (Railway + Vercel Prod)

# Deploys only what CI has already passed.
#
# This used to run on push, in parallel with CI, with its own "validation" that
# built the frontend and ran `node --check` on the backend. Both of those pass
# on code that cannot run, so a commit whose tests were failing deployed to
# production anyway - which is exactly what happened on 84340e0.
#
# workflow_run fires after CI finishes, and the conclusion check below means a
# red CI deploys nothing at all.
on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]

concurrency:
  # Two deploys racing to production is never what anyone wanted; the later
  # commit wins.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-backend-railway:
    name: Deploy Backend to Railway (Production)
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    # Lifted to the job because a step-level `if` cannot read `secrets` - only
    # `env`. Testing a secret from inside the same step's own `env:` block is
    # the trap the previous version fell into, and a step skipped that way
    # reports as success, so a deploy that never happened looked green.
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default, which may
          # have moved on. Deploy the commit CI actually verified.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        if: env.RAILWAY_TOKEN != ''
        working-directory: ./backend
        run: |
          if [ -n "$RAILWAY_SERVICE" ]; then
            railway up --service "$RAILWAY_SERVICE" --detach
          else
            railway up --detach
          fi

      - name: Say so when nothing was deployed
        if: env.RAILWAY_TOKEN == ''
        run: |
          echo "::warning::RAILWAY_TOKEN is not set - the backend was NOT deployed."
          echo "Add it under Settings -> Secrets and variables -> Actions."

  deploy-frontend-vercel:
    name: Deploy Frontend to Vercel (Production)
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy to Vercel (Production)
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'

      - name: Say so when nothing was deployed
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "::warning::VERCEL_TOKEN is not set - the frontend was NOT deployed."
          echo "Add it under Settings -> Secrets and variables -> Actions."

  report:
    name: Report a blocked deploy
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'success'
    steps:
      - name: Explain why nothing shipped
        run: |
          echo "::error::CI concluded '${{ github.event.workflow_run.conclusion }}' on ${{ github.event.workflow_run.head_sha }} - production was not deployed."
          echo "Fix the failing checks and push again."
          exit 1
