name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Production deploys are serialised rather than cancelled: a half-finished
  # deploy that gets cancelled is worse than one that waits its turn.
  group: deploy-prod
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  backend:
    name: Backend → Railway
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report missing secret
        if: ${{ secrets.RAILWAY_TOKEN == '' }}
        run: |
          echo "::error::RAILWAY_TOKEN is not set — the backend was NOT deployed."
          exit 1

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        # `secrets` is readable from `if`; a step's own `env` is not. The old
        # `if: env.RAILWAY_TOKEN != ''` therefore never passed, so production
        # deploys quietly did nothing while the run showed green.
        working-directory: ./backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "${{ secrets.RAILWAY_SERVICE }}" ]; then
            railway up --service "${{ secrets.RAILWAY_SERVICE }}" --detach
          else
            railway up --detach
          fi

  frontend:
    name: Frontend → Vercel (production)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report missing secret
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        run: |
          echo "::error::VERCEL_TOKEN is not set — the frontend was NOT deployed."
          exit 1

      - name: Deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'

  smoke:
    name: Post-deploy smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check the API answers
        # A deploy that finishes is not a deploy that works. If the health
        # endpoint does not answer, the run fails and you find out here rather
        # than from a customer.
        if: ${{ vars.PROD_API_URL != '' }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "${{ vars.PROD_API_URL }}/api/health" >/dev/null; then
              echo "API is healthy."
              exit 0
            fi
            echo "Attempt $i failed, waiting for the deploy to settle..."
            sleep 15
          done
          echo "::error::API did not become healthy after the deploy."
          exit 1

      - name: Skip note
        if: ${{ vars.PROD_API_URL == '' }}
        run: echo "::warning::Set the PROD_API_URL repository variable to enable the post-deploy health check."
