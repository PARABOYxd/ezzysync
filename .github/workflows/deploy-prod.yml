name: Deploy Production (Railway + Vercel Prod)

on:
  push:
    branches:
      - main

jobs:
  ci-validate:
    name: Production Pre-Deployment Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Production Frontend Build Test
        working-directory: ./frontend
        env:
          VITE_RAZORPAY_KEY_ID: ${{ secrets.PROD_VITE_RAZORPAY_KEY_ID || secrets.VITE_RAZORPAY_KEY_ID || 'rzp_test_TVVGy1XT8uURcp' }}
        run: |
          npm ci
          npm run build

      - name: Production Backend Syntax Check
        working-directory: ./backend
        run: |
          npm ci
          node --check server.js

  deploy-backend-railway:
    name: Deploy Backend to Railway (Production)
    needs: ci-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        if: ${{ env.RAILWAY_TOKEN != '' }}
        working-directory: ./backend
        run: |
          if [ -n "${{ secrets.RAILWAY_SERVICE }}" ]; then
            railway up --service "${{ secrets.RAILWAY_SERVICE }}" --detach
          else
            railway up --detach
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-frontend-vercel:
    name: Deploy Frontend to Vercel (Production)
    needs: ci-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        if: ${{ env.VERCEL_TOKEN != '' }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
