name: SEO IndexNow

# After each successful production deploy, tell IndexNow engines (Bing,
# Yandex, ...) which pages changed in the last 8 days so they recrawl now.
# Vercel reports deployments to GitHub, which fires deployment_status.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      days:
        description: "Submit pages changed in the last N days (365 = everything)"
        default: "8"

jobs:
  indexnow:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production' &&
       !contains(github.event.deployment_status.environment_url, 'frontend'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Submit changed URLs
        env:
          INDEXNOW_DAYS: ${{ github.event.inputs.days || '8' }}
        run: node scripts/seo/indexnow.mjs
